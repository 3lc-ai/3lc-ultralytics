[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -ra --strict-markers
# Fail hung tests (e.g. stuck dataloader workers) instead of stalling the job
timeout = 600
markers =
    slow: trains or collects with a real model (deselect with -m "not slow" for a quick local loop)
xfail_strict = true
filterwarnings =
    # NumPy 2 deprecation inside pycocotools
    ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning
