name: Test

on:
  pull_request:
  workflow_call:
    inputs:
      os-matrix:
        description: 'JSON array of OS runners'
        type: string
        default: '["ubuntu-latest"]'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          # Pin to match requirement in pyproject.toml
          version: "0.7.19"

      - name: Install dependencies
        run: |
          uv sync --group dev --no-sources

      - name: Run linting
        run: |
          uv run --no-sources ruff check .

      - name: Run type checking
        run: |
          uv run --no-sources ty check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix || '["ubuntu-latest"]') }}
        python-version: ['3.10', '3.13']
        # 3lc is released only on 3LC's public index (not PyPI). We test against
        # the latest 3lc minor (3.0), pinned to its latest patch.
        tlc-version: ['3.0']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          # Pin to match build-system.requires (uv_build>=0.7.19,<0.8.0). When
          # uv's bundled uv_build satisfies that range it builds this project
          # with the bundled backend and makes no network request. A newer uv
          # (e.g. "latest") would instead fetch an old uv-build from an index,
          # and unsafe-best-match routes that fetch to the (sometimes slow) 3lc
          # index, which can time out. release.yml pins the same version.
          version: "0.7.19"

      - name: Install dependencies
        run: |
          uv sync --group dev --no-sources --python ${{ matrix.python-version }}

      - name: Pin 3lc to ${{ matrix.tlc-version }}.*
        # Installs into the project .venv created by `uv sync` above; the test step
        # uses --no-sync so this pinned version is what actually runs.
        # `shell: bash` is required so the `\` line continuations below work on the
        # Windows runners, whose default shell (PowerShell) does not understand them.
        shell: bash
        run: |
          uv pip install \
            --index-url https://pypi.org/simple \
            --extra-index-url https://pypi.3lc.ai/public/repositories/releases-public \
            --index-strategy unsafe-best-match \
            "3lc==${{ matrix.tlc-version }}.*"

      - name: Run tests (3lc ${{ matrix.tlc-version }}, Python ${{ matrix.python-version }})
        run: |
          uv run --no-sources --no-sync --python ${{ matrix.python-version }} pytest tests/ -v -n 1
        env:
          TLC_API_KEY: ${{ secrets.TLC_API_KEY }}
          ${{ secrets.DEFAULT_TESTING_S_ENV_NAME }}: ${{ secrets.DEFAULT_TESTING_S_ENV_VALUE }}
          ${{ secrets.DEFAULT_TESTING_RUNTIME_NAME }}: ${{ secrets.DEFAULT_TESTING_RUNTIME_VALUE }}
